name: 个人赞助确认（中文）
description: 核对个人赞助档位并选择公开展示方式
title: "[个人赞助] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你的支持！Issue 是公开的，请勿填写完整交易单号、付款截图、手机号、邮箱或其他敏感信息。

        只有赞助档位是必填项。GitHub 身份默认使用 Issue 作者；支付时间留空时默认参考 Issue 创建时间；展示默认开启，如不希望公开请主动选择不公开。

  - type: dropdown
    id: sponsorship_tier
    attributes:
      label: 赞助档位
      description: 自定义金额按同一 GitHub 账号可核对的累计实付金额匹配最高个人档位。
      options:
        - 普通支持：人民币 20 元，永久保留公开致谢记录
        - 铜牌赞助：人民币 200 元，永久展示 GitHub 头像、用户名和主页链接
        - 银牌赞助：人民币 1,000 元，永久享有铜牌权益并进入突出显示的赞助者名单
        - 自定义金额：自行填写，按累计实付金额匹配最高个人档位
    validations:
      required: true

  - type: input
    id: amount
    attributes:
      label: 具体金额（可选）
      description: 选择自定义金额时请填写；固定档位可留空。
      placeholder: "人民币 300 元"

  - type: dropdown
    id: payment_method
    attributes:
      label: 支付方式（可选）
      options:
        - 微信支付
        - 支付宝

  - type: input
    id: payment_time
    attributes:
      label: 大致支付时间（可选）
      description: 留空则参考 Issue 创建时间；如不在东八区，请注明时区。
      placeholder: "YYYY-MM-DD HH:mm（UTC+8）"

  - type: dropdown
    id: recognition
    attributes:
      label: 展示偏好（可选）
      description: 默认公开并使用所选档位的永久权益；如不希望公开，请选择不公开展示。
      options:
        - 公开展示所选档位的权益
        - 不公开展示
      default: 0

  - type: input
    id: display_name
    attributes:
      label: 展示名称（可选）
      description: 留空时默认使用 Issue 作者的 GitHub 用户名。

  - type: input
    id: profile_url
    attributes:
      label: 个人主页或网站（可选）
      placeholder: "https://github.com/username"

  - type: textarea
    id: message
    attributes:
      label: 留言（可选）
