name: 个人赞助确认（中文）
description: 核对个人赞助档位并选择公开展示方式
title: "[个人赞助] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你的支持！Issue 是公开的，请勿填写完整交易单号、付款截图、手机号、邮箱或其他敏感信息。

        GitHub 身份使用 Issue 作者。这里填写的金额和档次只是待核对声明，不会直接授予权益；最终档次由维护者确认到账后写入私有账本，并按同一 GitHub ID 的累计权益自动计算。请勿填写完整交易单号或上传付款截图。

  - type: dropdown
    id: contribution_claim
    attributes:
      label: 本次赞助声明（待核对）
      description: 仅用于协助维护者核对，本项不会直接决定最终档次。
      options:
        - 本次赞助人民币 20 元
        - 本次赞助人民币 200 元
        - 本次赞助人民币 1,000 元
        - 其他金额，请在下一项填写
    validations:
      required: true

  - type: input
    id: amount
    attributes:
      label: 具体金额（可选）
      description: 选择其他金额时请填写；固定金额可留空。不要填写交易单号。
      placeholder: "人民币 300 元"

  - type: dropdown
    id: payment_method
    attributes:
      label: 支付方式（可选）
      options:
        - 微信支付
        - 支付宝

  - type: input
    id: payment_time
    attributes:
      label: 大致支付时间（可选）
      description: 留空则参考 Issue 创建时间；如不在东八区，请注明时区。
      placeholder: "YYYY-MM-DD HH:mm（UTC+8）"

  - type: dropdown
    id: recognition
    attributes:
      label: 展示偏好（可选）
      description: 只决定公开偏好，不改变累计金额或最终档次。
      options:
        - 公开展示所选档位的权益
        - 不公开展示
      default: 0

  - type: input
    id: display_name
    attributes:
      label: 展示名称（可选）
      description: 留空时默认使用 Issue 作者的 GitHub 用户名。

  - type: input
    id: profile_url
    attributes:
      label: 个人主页或网站（可选）
      placeholder: "https://github.com/username"

  - type: textarea
    id: message
    attributes:
      label: 留言（可选）
