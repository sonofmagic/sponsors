name: Sponsorship verification
description: Verify a sponsorship and choose how you would like to be recognized
title: "[Sponsor] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your support! Issues are public. Do not include a complete transaction ID, payment receipt, phone number, email address, or other sensitive information.

        All fields except sponsorship tier are optional. If payment time is omitted, the issue creation time will be used as a reference. Recognition defaults to the selected tier's benefits; choose no public recognition to opt out.

  - type: input
    id: github_username
    attributes:
      label: GitHub username (optional)
      placeholder: "@username"

  - type: dropdown
    id: sponsorship_tier
    attributes:
      label: Sponsorship tier (required)
      description: Select a fixed sponsorship package and its recognition benefits. Recognition is enabled by default; select no public recognition to opt out.
      options:
        - Standard support: CNY 20, thank-you only
        - Bronze sponsorship: CNY 200, GitHub avatar and profile link available
        - Silver sponsorship: CNY 1,000, includes Bronze benefits plus sponsor-list placement
        - Gold sponsorship: CNY 4,000, includes Silver benefits plus homepage or featured placement and public acknowledgment
        - Special sponsorship: CNY 10,000, includes Gold benefits plus custom recognition and dedicated collaboration discussion
        - Custom amount: totals under CNY 20 receive thank-you only; otherwise matches the highest tier not exceeding cumulative payments
    validations:
      required: true

  - type: dropdown
    id: payment_method
    attributes:
      label: Payment method (optional)
      options:
        - WeChat Pay
        - Alipay

  - type: input
    id: payment_time
    attributes:
      label: Approximate payment time (optional)
      description: Leave blank to use the issue creation time. Include your time zone if it is not UTC+8.
      placeholder: "YYYY-MM-DD HH:mm (UTC+8)"

  - type: input
    id: amount
    attributes:
      label: Exact amount (optional)
      description: Enter an amount when selecting Custom amount; fixed packages can leave this blank.
      placeholder: "CNY 300"

  - type: dropdown
    id: recognition
    attributes:
      label: Recognition preference (optional)
      description: Recognition defaults to the selected tier's benefits. Select no public recognition to opt out.
      options:
        - Use the recognition benefits from the selected tier
        - No public recognition
      default: 0

  - type: input
    id: display_name
    attributes:
      label: Display name (optional)
      description: Leave blank to use your GitHub username when provided.

  - type: input
    id: profile_url
    attributes:
      label: Profile or website URL (optional)
      placeholder: "https://github.com/username"

  - type: textarea
    id: message
    attributes:
      label: Message (optional)
