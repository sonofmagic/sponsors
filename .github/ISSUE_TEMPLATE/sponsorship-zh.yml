name: 赞助确认
description: 核对赞助并选择展示方式
title: "[赞助] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你的支持！Issue 是公开的，请勿填写完整交易单号、付款截图、手机号、邮箱或其他敏感信息。

        以下字段均为可选。未填写支付时间时，将以 Issue 创建时间作为参考；未选择展示偏好时，将默认不公开展示。

  - type: input
    id: github_username
    attributes:
      label: GitHub 用户名（可选）
      placeholder: "@username"

  - type: dropdown
    id: sponsorship_tier
    attributes:
      label: 赞助档位（可选）
      description: 请选择对应的赞助金额区间。档位仅用于核对，不自动改变展示权益。
      options:
        - 人民币 1-49 元
        - 人民币 50-199 元
        - 人民币 200-999 元
        - 人民币 1,000 元及以上
        - 不便透露

  - type: dropdown
    id: payment_method
    attributes:
      label: 支付方式（可选）
      options:
        - 微信支付
        - 支付宝

  - type: input
    id: payment_time
    attributes:
      label: 大致支付时间（可选）
      description: 留空则参考 Issue 创建时间；如不在东八区，请注明时区。
      placeholder: "YYYY-MM-DD HH:mm（UTC+8）"

  - type: input
    id: amount
    attributes:
      label: 具体金额（可选）
      placeholder: "人民币 100 元"

  - type: dropdown
    id: recognition
    attributes:
      label: 展示偏好（可选）
      description: 留空则默认不公开展示。
      options:
        - GitHub 头像、名称和主页链接
        - 仅展示名称
        - 匿名

  - type: input
    id: display_name
    attributes:
      label: 展示名称（可选）
      description: 如已填写 GitHub 用户名，留空即可使用。

  - type: input
    id: profile_url
    attributes:
      label: 个人主页或网站（可选）
      placeholder: "https://github.com/username"

  - type: textarea
    id: message
    attributes:
      label: 留言（可选）
