name: 赞助确认
description: 核对赞助并选择展示方式
title: "[赞助] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你的支持！Issue 是公开的，请勿填写完整交易单号、付款截图、手机号、邮箱或其他敏感信息。

        除赞助档位外，以下字段均为可选。未填写支付时间时，将以 Issue 创建时间作为参考；展示偏好默认使用所选档位的展示权益，如不希望公开请主动选择不公开展示。

  - type: input
    id: github_username
    attributes:
      label: GitHub 用户名（可选）
      placeholder: "@username"

  - type: dropdown
    id: sponsorship_tier
    attributes:
      label: 赞助档位（必填）
      description: 请选择对应的固定赞助套餐和展示权益。展示默认启用；如不希望公开，请在展示偏好中选择不公开。
      options:
        - 普通支持：人民币 20 元，仅致谢
        - 铜牌赞助：人民币 200 元，可展示 GitHub 头像和主页链接
        - 银牌赞助：人民币 1,000 元，包含铜牌权益并加入赞助者名单
        - 金牌赞助：人民币 4,000 元，包含银牌权益并提供首页或显著位置展示及公开致谢
        - 特别赞助：人民币 10,000 元，包含金牌权益并可协商定制展示和专项合作
        - 自定义金额：累计不足人民币 20 元仅致谢，否则匹配不高于累计实付金额的最高档位
    validations:
      required: true

  - type: dropdown
    id: payment_method
    attributes:
      label: 支付方式（可选）
      options:
        - 微信支付
        - 支付宝

  - type: input
    id: payment_time
    attributes:
      label: 大致支付时间（可选）
      description: 留空则参考 Issue 创建时间；如不在东八区，请注明时区。
      placeholder: "YYYY-MM-DD HH:mm（UTC+8）"

  - type: input
    id: amount
    attributes:
      label: 具体金额（可选）
      description: 选择自定义金额时请填写，套餐赞助可留空。
      placeholder: "人民币 300 元"

  - type: dropdown
    id: recognition
    attributes:
      label: 展示偏好（可选）
      description: 默认使用所选档位的展示权益；如不希望公开，请选择不公开展示。
      options:
        - 使用所选档位的展示权益
        - 不公开展示
      default: 0

  - type: input
    id: display_name
    attributes:
      label: 展示名称（可选）
      description: 如已填写 GitHub 用户名，留空即可使用。

  - type: input
    id: profile_url
    attributes:
      label: 个人主页或网站（可选）
      placeholder: "https://github.com/username"

  - type: textarea
    id: message
    attributes:
      label: 留言（可选）
