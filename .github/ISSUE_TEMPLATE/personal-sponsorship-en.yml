name: Individual sponsorship verification (English)
description: Verify an individual sponsorship tier and public recognition preference
title: "[Individual sponsor] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your support! Issues are public. Do not include a complete transaction ID, payment receipt, phone number, email address, or other sensitive information.

        The Issue author is the GitHub identity. Amounts and tiers entered here are claims awaiting verification and do not grant benefits directly. The maintainer records confirmed receipt in a private ledger, and the final tier is calculated from cumulative entitlement for the same immutable GitHub ID. Do not enter a complete transaction ID or upload a payment receipt.

  - type: dropdown
    id: contribution_claim
    attributes:
      label: Contribution claim awaiting verification
      description: This only helps the maintainer reconcile the payment and does not determine the final tier.
      options:
        - "This contribution is CNY 20"
        - "This contribution is CNY 200"
        - "This contribution is CNY 1,000"
        - "Another amount, entered below"
    validations:
      required: true

  - type: input
    id: amount
    attributes:
      label: Exact amount (optional)
      description: Enter an amount when selecting Another amount. Do not enter a transaction ID.
      placeholder: "CNY 300"

  - type: dropdown
    id: payment_method
    attributes:
      label: Payment method (optional)
      options:
        - WeChat Pay
        - Alipay

  - type: input
    id: payment_time
    attributes:
      label: Approximate payment time (optional)
      description: Leave blank to use the issue creation time. Include your time zone if it is not UTC+8.
      placeholder: "YYYY-MM-DD HH:mm (UTC+8)"

  - type: dropdown
    id: recognition
    attributes:
      label: Recognition preference (optional)
      description: This controls public visibility only and does not change cumulative entitlement or the final tier.
      options:
        - Use the public recognition benefits for the selected tier
        - No public recognition
      default: 0

  - type: input
    id: display_name
    attributes:
      label: Display name (optional)
      description: Leave blank to use the issue author's GitHub username.

  - type: input
    id: profile_url
    attributes:
      label: Profile or website URL (optional)
      placeholder: "https://github.com/username"

  - type: textarea
    id: message
    attributes:
      label: Message (optional)
