name: Sponsorship verification / 赞助确认
description: Verify a sponsorship and choose how you would like to be recognized / 核对赞助并选择展示方式
title: "[Sponsor] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your support! Issues are public. Do not include a complete transaction ID, payment receipt, phone number, email address, or other sensitive information.

        感谢你的支持！Issue 是公开的，请勿填写完整交易单号、付款截图、手机号、邮箱或其他敏感信息。

  - type: input
    id: github_username
    attributes:
      label: GitHub username (optional) / GitHub 用户名（可选）
      placeholder: "@username"

  - type: dropdown
    id: sponsorship_tier
    attributes:
      label: Sponsorship tier / 赞助档位
      description: Select the range that matches your sponsorship. The tier is for reconciliation and does not automatically change recognition rights. / 请选择对应的赞助金额区间。档位仅用于核对，不自动改变展示权益。
      options:
        - CNY 1-49 / 人民币 1-49 元
        - CNY 50-199 / 人民币 50-199 元
        - CNY 200-999 / 人民币 200-999 元
        - CNY 1,000 or more / 人民币 1,000 元及以上
        - Prefer not to say / 不便透露
    validations:
      required: true

  - type: dropdown
    id: payment_method
    attributes:
      label: Payment method / 支付方式
      options:
        - WeChat Pay / 微信支付
        - Alipay / 支付宝
    validations:
      required: true

  - type: input
    id: payment_time
    attributes:
      label: Approximate payment time / 大致支付时间
      description: Include your time zone if it is not UTC+8 / 如不在东八区，请注明时区
      placeholder: "2026-08-15 14:30 (UTC+8)"
    validations:
      required: true

  - type: input
    id: amount
    attributes:
      label: Exact amount (optional) / 具体金额（可选）
      placeholder: "CNY 100"

  - type: dropdown
    id: recognition
    attributes:
      label: Recognition preference / 展示偏好
      description: Choose what may be shown in related repositories and websites / 选择可在相关项目和网站中公开展示的内容
      options:
        - GitHub avatar, name, and profile link / GitHub 头像、名称和主页链接
        - Name only / 仅展示名称
        - Anonymous / 匿名
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: Display name (optional) / 展示名称（可选）
      description: Leave blank to use your GitHub username when provided / 如已填写 GitHub 用户名，留空即可使用

  - type: input
    id: profile_url
    attributes:
      label: Profile or website URL (optional) / 个人主页或网站（可选）
      placeholder: "https://github.com/username"

  - type: textarea
    id: message
    attributes:
      label: Message (optional) / 留言（可选）

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I have not included sensitive payment or personal information / 我没有填写敏感的支付或个人信息
          required: true
