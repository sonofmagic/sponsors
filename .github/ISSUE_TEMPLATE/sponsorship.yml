name: Sponsorship verification / 赞助确认
description: Verify a sponsorship and choose how you would like to be recognized / 核对赞助并选择展示方式
title: "[Sponsor] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your support! Issues are public. Do not include a complete transaction ID, payment receipt, phone number, email address, or other sensitive information.

        All fields below are optional. If payment time is omitted, the issue creation time will be used as a reference. If recognition preference is omitted, no public recognition will be added.

        感谢你的支持！Issue 是公开的，请勿填写完整交易单号、付款截图、手机号、邮箱或其他敏感信息。

        以下字段均为可选。未填写支付时间时，将以 Issue 创建时间作为参考；未选择展示偏好时，将默认不公开展示。

  - type: dropdown
    id: language
    attributes:
      label: Language (optional) / 语言（可选）
      description: Choose the language for follow-up communication. / 请选择后续沟通使用的语言。
      options:
        - 中文 / Chinese
        - English / 英文

  - type: input
    id: github_username
    attributes:
      label: GitHub username (optional) / GitHub 用户名（可选）
      placeholder: "@username"

  - type: dropdown
    id: sponsorship_tier
    attributes:
      label: Sponsorship tier (optional) / 赞助档位（可选）
      description: Select the range that matches your sponsorship. The tier is for reconciliation and does not automatically change recognition rights. / 请选择对应的赞助金额区间。档位仅用于核对，不自动改变展示权益。
      options:
        - CNY 1-49 / 人民币 1-49 元
        - CNY 50-199 / 人民币 50-199 元
        - CNY 200-999 / 人民币 200-999 元
        - CNY 1,000 or more / 人民币 1,000 元及以上
        - Prefer not to say / 不便透露

  - type: dropdown
    id: payment_method
    attributes:
      label: Payment method (optional) / 支付方式（可选）
      options:
        - WeChat Pay / 微信支付
        - Alipay / 支付宝

  - type: input
    id: payment_time
    attributes:
      label: Approximate payment time (optional) / 大致支付时间（可选）
      description: Leave blank to use the issue creation time. Include your time zone if it is not UTC+8. / 留空则参考 Issue 创建时间；如不在东八区，请注明时区。
      placeholder: "YYYY-MM-DD HH:mm (UTC+8)"

  - type: input
    id: amount
    attributes:
      label: Exact amount (optional) / 具体金额（可选）
      placeholder: "CNY 100"

  - type: dropdown
    id: recognition
    attributes:
      label: Recognition preference (optional) / 展示偏好（可选）
      description: Leave blank for no public recognition. / 留空则默认不公开展示。
      options:
        - GitHub avatar, name, and profile link / GitHub 头像、名称和主页链接
        - Name only / 仅展示名称
        - Anonymous / 匿名

  - type: input
    id: display_name
    attributes:
      label: Display name (optional) / 展示名称（可选）
      description: Leave blank to use your GitHub username when provided / 如已填写 GitHub 用户名，留空即可使用

  - type: input
    id: profile_url
    attributes:
      label: Profile or website URL (optional) / 个人主页或网站（可选）
      placeholder: "https://github.com/username"

  - type: textarea
    id: message
    attributes:
      label: Message (optional) / 留言（可选）
