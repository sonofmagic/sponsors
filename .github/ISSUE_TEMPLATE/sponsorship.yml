name: Sponsorship verification / 赞助确认
description: Verify a sponsorship and choose how you would like to be recognized / 核对赞助并选择展示方式
title: "[Sponsor] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your support! Issues are public. Do not include a complete transaction ID, payment receipt, phone number, email address, or other sensitive information.

        感谢你的支持！Issue 是公开的，请勿填写完整交易单号、付款截图、手机号、邮箱或其他敏感信息。

  - type: input
    id: github_username
    attributes:
      label: GitHub username / GitHub 用户名
      placeholder: "@username"
    validations:
      required: true

  - type: dropdown
    id: payment_method
    attributes:
      label: Payment method / 支付方式
      options:
        - WeChat Pay / 微信支付
        - Alipay / 支付宝
    validations:
      required: true

  - type: input
    id: payment_time
    attributes:
      label: Approximate payment time / 大致支付时间
      description: Include your time zone if it is not UTC+8 / 如不在东八区，请注明时区
      placeholder: "2026-08-15 14:30 (UTC+8)"
    validations:
      required: true

  - type: input
    id: amount
    attributes:
      label: Amount (optional) / 金额（可选）
      placeholder: "CNY 100"

  - type: dropdown
    id: recognition
    attributes:
      label: Recognition preference / 展示偏好
      description: Choose what may be shown in related repositories and websites / 选择可在相关项目和网站中公开展示的内容
      options:
        - GitHub avatar, name, and profile link / GitHub 头像、名称和主页链接
        - Name only / 仅展示名称
        - Anonymous / 匿名
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: Display name (optional) / 展示名称（可选）
      description: Leave blank to use your GitHub username / 留空则使用 GitHub 用户名

  - type: input
    id: profile_url
    attributes:
      label: Profile or website URL (optional) / 个人主页或网站（可选）
      placeholder: "https://github.com/username"

  - type: textarea
    id: message
    attributes:
      label: Message (optional) / 留言（可选）

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I have not included sensitive payment or personal information / 我没有填写敏感的支付或个人信息
          required: true
